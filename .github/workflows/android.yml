name: SKADOSH Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==3.0.11

      - name: Verify
        run: |
          test -f android_build/buildozer.spec
          test -f android_client/main.py

      - name: Build APK
        working-directory: android_build
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKADOSH-debug-APK
          path: android_build/bin/*.apk
          if-no-files-found: error
